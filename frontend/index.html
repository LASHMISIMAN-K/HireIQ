<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HireIQ ✨</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <nav>

        <div class="logo">
            HireIQ ✨
        </div>

        <span>
            AI Resume Analyzer
        </span>

    </nav>


    <main>

        <section class="hero">

            <h1>
                Glow up your resume.
            </h1>

            <p>
                Get an AI-powered resume analysis
                and discover what recruiters are looking for.
            </p>

        </section>


        <section class="card">

            <label>
                Target Job Role
            </label>

            <input
                type="text"
                id="jobRole"
                placeholder="e.g. Frontend Developer"
            >


            <label>
                Upload Resume
            </label>

            <input
                type="file"
                id="resume"
                accept=".pdf"
            >


            <button onclick="analyzeResume()">

                Analyze My Resume ✨

            </button>

            <p id="status"></p>

        </section>


        <section
            id="results"
            class="results hidden"
        >

            <div class="score-card">

                <h2>ATS Score</h2>

                <div id="score">
                    0
                </div>

                <span>
                    / 100
                </span>

            </div>


            <div class="result-card">

                <h2>Summary</h2>

                <p id="summary"></p>

            </div>


            <div class="result-card">

                <h2>Matched Skills</h2>

                <div id="matchedSkills"></div>

            </div>


            <div class="result-card">

                <h2>Missing Skills</h2>

                <div id="missingSkills"></div>

            </div>


            <div class="result-card">

                <h2>Strengths</h2>

                <ul id="strengths"></ul>

            </div>


            <div class="result-card">

                <h2>Weaknesses</h2>

                <ul id="weaknesses"></ul>

            </div>


            <div class="result-card">

                <h2>AI Suggestions ✨</h2>

                <ul id="suggestions"></ul>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
